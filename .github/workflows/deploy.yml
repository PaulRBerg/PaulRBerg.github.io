name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages (OIDC token + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the latest deployment; cancel superseded builds and publishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and publish in one job: a separate deploy job costs a second runner
  # allocation (~10s) for a single API call plus status polling.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Astro assets
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          # Astro hashes individual images; reuse unchanged assets across commits.
          key: ${{ runner.os }}-${{ runner.arch }}-astro-v1-${{ hashFiles('bun.lock', 'astro.config.mts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-astro-v1-${{ hashFiles('bun.lock', 'astro.config.mts') }}-

      - name: Cache presentations
        id: presentations
        uses: actions/cache@v6
        with:
          path: |
            public/presentations/cce-2026
            public/presentations/frontiers-2026
          # Only an exact match can skip the build; include sources, assets and toolchain.
          key: ${{ runner.os }}-${{ runner.arch }}-slides-v1-${{ hashFiles('slides/**', 'bun.lock', 'package.json', 'tsconfig.json', '.github/workflows/deploy.yml') }}

      - name: Build presentations
        if: steps.presentations.outputs.cache-hit != 'true'
        run: bun run build:slides

      - name: Build site and search index
        run: bun run build:site

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Status polling starts here and backs off 1.5x per poll (max 30s), so
          # the default 5000ms overshoots a ~15-40s deployment by up to 15s.
          reporting_interval: 1000
